apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cluster-client.fullname" . }}-files
  labels:
    {{- include "cluster-client.labels" . | nindent 4 }}
data:
  {{- range $name := list "response-schema.json" "ignored-fields.json" "redacted-fields.json" }}
  {{ $name }}: |-
    {{- $.Files.Get (printf "files/%s" $name) | required (printf "helm/files/%s is missing" $name) | nindent 4 }}
  {{- end }}
