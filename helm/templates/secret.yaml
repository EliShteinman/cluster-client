{{- if .Values.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-client.fullname" . }}
  labels:
    {{- include "cluster-client.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
