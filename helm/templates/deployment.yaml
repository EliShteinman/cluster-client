apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-client.fullname" . }}
  labels:
    {{- include "cluster-client.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cluster-client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/files: {{ include (print $.Template.BasePath "/configmap-files.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "cluster-client.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "cluster-client.fullname" . }}
            {{- if .Values.secret }}
            - secretRef:
                name: {{ include "cluster-client.fullname" . }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: {{ .Values.mounts.files }}
              readOnly: true
            - name: logs
              mountPath: {{ .Values.mounts.logs }}
      volumes:
        - name: files
          configMap:
            name: {{ include "cluster-client.fullname" . }}-files
        - name: logs
          emptyDir:
            sizeLimit: {{ .Values.logsSizeLimit }}
