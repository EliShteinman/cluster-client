[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cluster-client"
version = "0.1.0"
description = "Sends one request to the target named in it and returns the answer only if it passes the firewall schema"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "jsonschema>=4.23",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation>=0.49b0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-logging>=0.49b0,!=0.61.*,!=0.62.*,!=0.63.*",
    "opentelemetry-instrumentation-requests>=0.49b0",
    "opentelemetry-sdk>=1.28.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.5",
    "requests>=2.32",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "basedpyright>=1.30",
    "import-linter>=2",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.15.14",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PT", "BLE", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"run_local.py" = ["S104", "S106"]

[tool.basedpyright]
include = ["app", "tests", "docker", "run_local.py"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
containers = ["app"]
exhaustive = true
layers = [
    "main | server",
    "routes",
    "failures | target | telemetry",
    "access | rules",
    "models",
    "logger",
    "errors | config",
]

[[tool.importlinter.contracts]]
name = "rules layers"
type = "layers"
containers = ["app.rules"]
exhaustive = true
layers = [
    "response_rules",
    "schema | schema_limits",
    "field_paths",
    "json_reading",
]

[[tool.importlinter.contracts]]
name = "target layers"
type = "layers"
containers = ["app.target"]
exhaustive = true
layers = [
    "response_builder | client",
]

[[tool.importlinter.contracts]]
name = "config layers"
type = "layers"
containers = ["app.config"]
exhaustive = true
layers = [
    "settings",
    "server | application | access | headers | forwarding | validation | failures | logging | telemetry",
    "base | field_types",
    "constants",
]
