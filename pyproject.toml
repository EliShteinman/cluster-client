[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cluster-client"
version = "0.1.0"
description = "Client for the Redis Enterprise REST API of the clusters in its network; validates every response against a schema"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "jsonschema>=4.23",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation>=0.49b0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-logging>=0.49b0,!=0.61.*,!=0.62.*,!=0.63.*",
    "opentelemetry-instrumentation-requests>=0.49b0",
    "opentelemetry-sdk>=1.28.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.2",
    "requests>=2.32",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "basedpyright>=1.30",
    "import-linter>=2",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PT", "BLE", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
include = ["app", "tests", "docker", "run_local.py"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
containers = ["app"]
exhaustive = true
layers = [
    "main | server",
    "routes",
    "failures | response_builder | cluster_client | telemetry",
    "schema | field_paths",
    "models",
    "logger",
    "errors | config",
]
