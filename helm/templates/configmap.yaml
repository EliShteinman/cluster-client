apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cluster-client.fullname" . }}
  labels:
    {{- include "cluster-client.labels" . | nindent 4 }}
data:
  CLUSTER_CLIENT_SERVER__HOST: "0.0.0.0"
  CLUSTER_CLIENT_SERVER__PORT: {{ .Values.containerPort | quote }}
  CLUSTER_CLIENT_VALIDATION__SCHEMA_PATH: "/etc/cluster-client/response-schema.json"
  CLUSTER_CLIENT_LOG__FILE__PATH: {{ printf "%s/app.log" .Values.logsVolume.mountPath | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
