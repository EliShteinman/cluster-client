replicaCount: 1

domain: ""

image:
  registry: artifactory
  repository: cluster-client
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  port: 80

route:
  name: cluster-client
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

files:
  schema: /etc/cluster-client/response-schema.json
  ignoredFields: /etc/cluster-client/ignored-fields.json
  redactedFields: /etc/cluster-client/redacted-fields.json

logs:
  directory: /app/logs
  app: app.log
  failures: failures.log

logsSizeLimit: 512Mi

config:
  CLUSTER_CLIENT_LOG__LEVEL: INFO
  CLUSTER_CLIENT_LOG__CONSOLE__FORMAT: json
  CLUSTER_CLIENT_LOG__FILE__ENABLED: "false"
  CLUSTER_CLIENT_LOG__FAILURE_FILE__ENABLED: "true"

secret: {}

collector:
  enabled: false
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.164.0"
    pullPolicy: IfNotPresent
  logLevel: DEBUG
  elasticsearch:
    endpoint: ""
    username: ""
    password: ""
    insecureSkipVerify: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
