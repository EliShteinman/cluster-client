apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "cluster-client.fullname" . }}
  labels:
    {{- include "cluster-client.labels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "cluster-client.fullname" . }}
  port:
    targetPort: http
  tls:
    {{- toYaml .Values.route.tls | nindent 4 }}
