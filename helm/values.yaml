replicaCount: 1

image:
  repository: cluster-client
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  port: 80

route:
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

mounts:
  files: /etc/cluster-client
  logs: /app/logs

logsSizeLimit: 512Mi

config:
  CLUSTER_CLIENT_LOG__LEVEL: INFO
  CLUSTER_CLIENT_LOG__CONSOLE__FORMAT: json
  CLUSTER_CLIENT_LOG__FILE__ENABLED: "false"
  CLUSTER_CLIENT_LOG__FAILURE_FILE__ENABLED: "true"

secret: {}

files:
  response-schema.json:
    $schema: https://json-schema.org/draft/2020-12/schema
  ignored-fields.json: []
  redacted-fields.json:
    - $.authentication_admin_pass
    - $.authentication_redis_pass
    - $.authentication_sasl_pass
    - $[*].authentication_admin_pass
    - $[*].authentication_redis_pass
    - $[*].authentication_sasl_pass
    - $.default_db_config.authentication_admin_pass
    - $.default_db_config.authentication_redis_pass
    - $.default_db_config.authentication_sasl_pass
    - $.instances[*].db_config.authentication_admin_pass
    - $.instances[*].db_config.authentication_redis_pass
    - $.instances[*].db_config.authentication_sasl_pass
    - $.instances[*].cluster.credentials.password
    - $.crdbs[*].default_db_config.authentication_admin_pass
    - $.crdbs[*].default_db_config.authentication_redis_pass
    - $.crdbs[*].default_db_config.authentication_sasl_pass
    - $.crdbs[*].instances[*].db_config.authentication_admin_pass
    - $.crdbs[*].instances[*].db_config.authentication_redis_pass
    - $.crdbs[*].instances[*].db_config.authentication_sasl_pass
    - $.crdbs[*].instances[*].cluster.credentials.password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
