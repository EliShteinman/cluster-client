apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-client.fullname" . }}
  labels:
    {{- include "cluster-client.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "cluster-client.selectorLabels" . | nindent 4 }}
