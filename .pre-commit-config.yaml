repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: lint-imports
        entry: uv run --frozen lint-imports
        language: system
        types: [python]
        pass_filenames: false
