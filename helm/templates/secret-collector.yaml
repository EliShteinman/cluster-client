{{- if .Values.collector.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-client.fullname" . }}-collector
  labels:
    {{- include "cluster-client.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.collector.elasticsearch.username | b64enc | quote }}
  password: {{ .Values.collector.elasticsearch.password | b64enc | quote }}
{{- end }}
